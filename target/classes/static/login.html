<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Challan Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:linear-gradient(135deg,#0d2b4e,#1f5fa8);min-height:100vh}.card{max-width:400px}</style></head>
<body class="d-flex align-items-center justify-content-center">
<div class="card shadow-lg w-100 mx-3"><div class="card-body p-4">
  <h4 class="text-center mb-1">Traffic E-Challan</h4>
  <p class="text-center text-muted small mb-4">Issue &amp; Repeat Offender Tracker</p>
  <div id="err" class="alert alert-danger d-none"></div>
  <div class="mb-3"><label class="form-label">Username</label><input id="u" class="form-control" value="officer1"></div>
  <div class="mb-3"><label class="form-label">Password</label><input id="p" type="password" class="form-control" placeholder="Password"></div>
  <button id="go" class="btn btn-primary w-100">Sign in</button>
  <p class="small text-muted mt-3 mb-0">Demo: admin / Admin@123 &nbsp;|&nbsp; officer1 / Officer@123</p>
</div></div>
<script>
async function login(){
  const err=document.getElementById('err'); err.classList.add('d-none');
  const body={username:u.value,password:p.value};
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok) throw new Error(d.errors?Object.values(d.errors).join(', '):d.message);
    sessionStorage.setItem('auth',btoa(body.username+':'+body.password));
    sessionStorage.setItem('user',JSON.stringify(d));
    location.href='index.html';
  }catch(e){err.textContent=e.message;err.classList.remove('d-none');}
}
document.getElementById('go').onclick=login;
document.getElementById('p').onkeydown=e=>{if(e.key==='Enter')login();};
</script></body></html>
