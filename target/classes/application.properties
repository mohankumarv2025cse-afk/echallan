spring.application.name=echallan
server.port=${PORT:8081}
# Default to the in-memory H2 database for local dev; if DB_HOST is set, the app will still use MySQL automatically.
spring.profiles.default=h2
# ---- MySQL (override with environment variables; never hardcode real passwords) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:echallan_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false
# ---- App rules ----
echallan.rolling-window-months=12
echallan.due-days=15
echallan.seed-demo-data=true
echallan.admin-password=${ADMIN_PASSWORD:Admin@123}
echallan.officer-password=${OFFICER_PASSWORD:Officer@123}
