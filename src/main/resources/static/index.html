<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic E-Challan Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
 #sidebar{width:230px;min-height:100vh;background:#0d2b4e}
 #sidebar .nav-link{color:#c9d8ec;border-radius:6px;cursor:pointer}
 #sidebar .nav-link:hover,#sidebar .nav-link.active{background:#1f5fa8;color:#fff}
 .stat{border-left:5px solid #1f5fa8}
 @media(max-width:768px){#sidebar{width:100%;min-height:auto}#layout{flex-direction:column}}
</style></head>
<body><div class="d-flex" id="layout">
 <nav id="sidebar" class="p-3 text-white">
  <h5 class="mb-0">🚦 E-Challan</h5><div class="small text-info mb-3" id="who"></div>
  <ul class="nav flex-column gap-1" id="menu"></ul>
  <button class="btn btn-outline-light btn-sm mt-4 w-100" onclick="logout()">Logout</button>
 </nav>
 <main class="flex-grow-1 p-4 bg-light"><div id="alert"></div><div id="view"></div></main>
</div>
<div class="modal fade" id="modal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
 <div class="modal-header"><h5 class="modal-title" id="mTitle"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
 <div class="modal-body" id="mBody"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script></body></html>
